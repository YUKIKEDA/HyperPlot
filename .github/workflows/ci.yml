name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  gate:
    name: build.ps1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the merge gate: the GPU tests (WARP) and the WPF adapter run there. Linux runs the same script for the
        # layers that need neither (design §10).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The WARP that draws the golden images; a baseline written on another version may differ (design §10.1).
      - name: WARP version
        if: runner.os == 'Windows'
        run: (Get-Item "$env:SystemRoot\System32\d3d10warp.dll").VersionInfo.FileVersion

      - name: Gate
        run: ./build.ps1

      # A golden image test that fails leaves the image drawn and the difference beside its binary (design §10.1).
      - name: Upload golden image output
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: golden-output
          path: tests/HyperPlot.Rendering.D3D11.Tests/bin/*/*/golden-output/
          if-no-files-found: ignore
